name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run emulator tests
        run: npm run test:emulator

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: personal-website-490704

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          docker build -f backend/Dockerfile \
            -t asia-southeast1-docker.pkg.dev/personal-website-490704/personal-website/backend:${{ github.sha }} \
            backend/
          docker push asia-southeast1-docker.pkg.dev/personal-website-490704/personal-website/backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: personal-website-490704

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy personal-website-backend \
            --image asia-southeast1-docker.pkg.dev/personal-website-490704/personal-website/backend:${{ github.sha }} \
            --platform managed \
            --region asia-southeast1 \
            --project personal-website-490704 \
            --allow-unauthenticated \
            --port 8080 \
            --max-instances=1 \
            --set-env-vars "^@^NODE_ENV=production@API_KEY=${{ secrets.API_KEY }}@ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}"

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe personal-website-backend --region asia-southeast1 --project personal-website-490704 --format 'value(status.url)')
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health")
          if [ "$STATUS" != "200" ]; then echo "Health check failed with status $STATUS"; exit 1; fi
